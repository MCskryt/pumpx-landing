<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PumpX - Tankning utan krångel</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.8rem;
      color: #00e1ff;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 1.4rem;
      font-weight: normal;
      color: #a0ffa0;
      margin-bottom: 30px;
      text-align: center;
    }
    .btn {
      background: #00e1ff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 30px;
    }
    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 400px;
      width: 100%;
      margin-top: 20px;
    }
    input {
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }
    footer {
      margin-top: 60px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>PumpX</h1>
  <h2>Ett nytt sätt att tanka – utan kort, utan krångel, med en enda faktura.</h2>
  <form class="form">
    <input type="text" placeholder="Ditt namn" required />
    <input type="email" placeholder="Din e-post" required />
    <button type="submit" class="btn">Jag vill testa appen</button>
  </form>
  <footer>
    &copy; 2025 PumpX. Skapat av Martin Falk.
  </footer>
</body>
</html>
